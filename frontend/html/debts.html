<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Finance</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div id="page-content">
        <main class="content">

            <div class="page-header">
                <h1>Debts</h1>
            </div>

            <section class="dashboard-section">
                <h2>Your overall position</h2>

                <div class="balance-grid" id="user-position">
                    <div class="balance-card">
                        <div class="balance-currency">EUR</div>
                        <div class="balance-value">Loading...</div>
                    </div>

                    <div class="balance-card">
                        <div class="balance-currency">RUB</div>
                        <div class="balance-value">Loading...</div>
                    </div>

                    <div class="balance-card">
                        <div class="balance-currency">USD</div>
                        <div class="balance-value">Loading...</div>
                    </div>
                </div>
            </section>

            <section class="dashboard-section">
                <h2>Debts by workspace</h2>

                <div id="global-debts">
                    <p>Loading debts...</p>
                </div>
            </section>

        </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/app-shell.js"></script>
    <script src="../js/debt.js"></script>

</body>

</html>
